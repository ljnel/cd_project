[workspace]
name = "cd_project"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pytest = "*"
matplotlib = "<3.10"
numpy = "*"
scikit-learn = "*"
scipy = "*"
pandas = "*"
seaborn = "*"
pytorch = "*"
torchvision = "*"
ipykernel = "*"
lightning = "*"
sktime = "*"
numba = ">=0.64.0,<0.65"
ruff = "*"
pybullet = ">=3.25,<4"
umap-learn = ">=0.5.11,<0.6"
tqdm = "4.66.1.*"
jupyterlab = ">=4.5.6,<5"
cython = ">=3.2.4,<4"
uv = ">=0.11.2,<0.12"

[pypi-dependencies]
stable-baselines3 = "*"
sb3-contrib = "*"
gymnasium = { version = "*", extras = ["mujoco"] }
tensorboard = "*"
tensorboardX = "*"
upkie = "*"
cd_project = { path = ".", editable = true }
sigkerax = ">=0.2.1, <0.3"

[tasks]
gen_data = "python -m data.datasets --overwrite"
gen_train = "python -m data.datasets --keys inv_pend/train hopper/train half_cheetah/train ant/train humanoid/train upkie/train --overwrite"
gen_test = "python -m data.datasets --keys inv_pend/test hopper/test half_cheetah/test ant/test humanoid/test upkie/test --overwrite"
gen_tune = "python -m data.datasets --keys inv_pend/tune hopper/tune half_cheetah/tune ant/tune humanoid/tune upkie/tune --overwrite"
tune = "rm -rf results/tuned && python src/scripts/tune.py --env all"
fail_pred = "python src/scripts/fail_pred_results.py --env all --tr-ep 500"

[target.linux-64.dependencies]
cuda-nvcc = ">=12.6.3"

[target.linux-64.pypi-dependencies]
jax = {version = "*", extras = ["cuda12"]}

