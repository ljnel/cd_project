[project]
name = "cd_project"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pytest = "*"
matplotlib = "<3.10"
numpy = "*"
scikit-learn = "*"
scipy = "*"
pandas = "*"
seaborn = "*"
pytorch = "*"
torchvision = "*"
ipykernel = "*"
lightning = "*"
sktime = "*"
numba = "*"
ruff = "*"
pybullet = ">=3.25,<4"
umap-learn = ">=0.5.11,<0.6"

[pypi-dependencies]
stable-baselines3 = "*"
sb3-contrib = "*"
gymnasium = { version = "*", extras = ["mujoco"] }
tensorboard = "*"
tensorboardX = "*"
upkie = "*"
cd_project = { path = ".", editable = true }

[tasks]
gen_data = "python -m data.datasets --overwrite"
gen_fail_pred = "python -m data.datasets --keys inv_pend/fail_pred hopper/fail_pred half_cheetah/fail_pred ant/fail_pred humanoid/fail_pred upkie/fail_pred --overwrite"
gen_tune = "python -m data.datasets --keys inv_pend/tune hopper/tune half_cheetah/tune ant/tune humanoid/tune upkie/tune --overwrite"
tune = "rm -rf results/tuned && python src/scripts/tune.py --env all"
fail_pred = "python src/scripts/fail_pred_results.py --env all"
