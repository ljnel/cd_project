[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cd_project"
version = "0.1.0"
dependencies = ["numpy", "scipy", "scikit-learn"]

# Flat layout: the importable package is `cd/` at the repo root.
# `include` is essential — without it, packages.find (namespaces = true by
# default) would also collect scripts/, tests/, nbs/ and ship them in the wheel.
[tool.setuptools.packages.find]
include = ["cd*"]

[tool.ruff]
src = ["."]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "E741"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]
# Flat layout: first-party modules import as `cd.algs.*`, `cd.utils.*`, ...
typeCheckingMode = "basic"

# cd/ (the library) stays fully type-checked. scripts/ is numpy/gym/scipy-heavy
# glue code where those packages' loose stubs produce false positives, so relax
# the stub-driven rules there only. ruff still lints scripts/ (see [tool.ruff]).
[[tool.pyright.executionEnvironments]]
root = "scripts"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportOperatorIssue = "none"
reportAssignmentType = "none"
reportReturnType = "none"
reportIndexIssue = "none"
reportGeneralTypeIssues = "none"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib._fontconfig_pattern",
    "ignore::DeprecationWarning:matplotlib._mathtext",
]
